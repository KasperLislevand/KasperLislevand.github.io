<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kasper Lislevand</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When a page refresh hits a URL that isn't a real file, GitHub Pages
      // serves this 404.html. We encode the intended path into a query string
      // and redirect to the root, where index.html will decode it.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
      );
    </script>
  </head>
</html>
